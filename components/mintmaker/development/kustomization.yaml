apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - https://github.com/konflux-ci/mintmaker/config/default?ref=ed27b4872df93a19641348240f243065adcd90d9
  - https://github.com/konflux-ci/mintmaker/config/renovate?ref=ed27b4872df93a19641348240f243065adcd90d9
images:
  - name: quay.io/konflux-ci/mintmaker
    newName: quay.io/scoheb/mintmaker
    newTag: sslcert18
  - name: quay.io/konflux-ci/mintmaker-renovate-image
    newName: quay.io/scoheb/mintmaker-renovate-image
    newTag: env-var-propagation-fix
namespace: mintmaker
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
configurations:
  - kustomizeconfig.yaml
components:
  - ../components/rh-certs
